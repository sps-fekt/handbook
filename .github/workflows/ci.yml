name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Only a check. The server deploys on its own (deploy.yml), see README.md.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check the deploy script
        run: bash -n deploy/deploy.sh
